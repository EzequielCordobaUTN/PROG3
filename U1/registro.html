<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario de Registro</title>
</head>
<body>
  <h1>Registro de Usuario</h1>

  <form action="#" method="post">
    <!-- Nombre -->
    <label for="nombre">Nombre completo:</label>
    <input type="text" id="nombre" name="nombre" required placeholder="Ej: Juan Pérez"><br><br>

    <!-- Correo -->
    <label for="correo">Correo electrónico:</label>
    <input type="email" id="correo" name="correo" required placeholder="Ej: correo@ejemplo.com"><br><br>

    <!-- Contraseña -->
    <label for="password">Contraseña:</label>
    <input type="password" id="password" name="password" required placeholder="Mínimo 8 caracteres"><br><br>

    <!-- Género -->
    <p>Género:</p>
    <input type="radio" id="masculino" name="genero" value="Masculino">
    <label for="masculino">Masculino</label>
    <input type="radio" id="femenino" name="genero" value="Femenino">
    <label for="femenino">Femenino</label>
    <input type="radio" id="otro" name="genero" value="Otro">
    <label for="otro">Otro</label><br><br>

    <!-- Intereses -->
    <p>Intereses:</p>
    <input type="checkbox" id="musica" name="intereses" value="Música">
    <label for="musica">Música</label>
    <input type="checkbox" id="deporte" name="intereses" value="Deporte">
    <label for="deporte">Deporte</label>
    <input type="checkbox" id="lectura" name="intereses" value="Lectura">
    <label for="lectura">Lectura</label>
    <input type="checkbox" id="videojuegos" name="intereses" value="Videojuegos">
    <label for="videojuegos">Videojuegos</label>
    <input type="checkbox" id="anime" name="intereses" value="Anime">
    <label for="anime">Anime</label><br><br>

    <!-- Comentarios -->
    <label for="comentarios">Comentarios adicionales:</label><br>
    <textarea id="comentarios" name="comentarios" placeholder="Escribe aquí..."></textarea><br><br>

    <!-- País -->
    <label for="pais">País:</label>
    <select id="pais" name="pais">
      <option value="Argentina">Argentina</option>
      <option value="Brasil">Brasil</option>
      <option value="Chile">Chile</option>
      <option value="México">México</option>
      <option value="España">España</option>
      <option value="Japón">Japón</option>
    </select><br><br>

    <!-- Botón -->
    <input type="submit" value="Registrarse">
  </form>
</body>
</html>
